const labels={pos:['Cashier / POS','Kasa','Касса'],orders:['Kitchen orders','Mutfak siparişleri','Заказы кухни'],staff:['Employees','Personel','Сотрудники'],reports:['Reports & analytics','Raporlar','Отчёты'],newOrder:['New order','Yeni sipariş','Новый заказ'],send:['Send to kitchen','Mutfağa gönder','Отправить на кухню'],table:['Table','Masa','Стол'],total:['Total','Toplam','Итого'],revenue:['Revenue','Ciro','Выручка'],gross:['Gross margin (ingredients only)','Brüt marj (malzeme)','Маржа по продуктам'],average:['Average check','Ortalama hesap','Средний чек'],served:['Served','Servis edildi','Выдан'],new:['New','Yeni','Новый'],preparing:['Preparing','Hazırlanıyor','Готовится'],readyOrder:['Ready','Hazır','Готов'],assign:['Assigned chef','Atanan şef','Ответственный повар'],station:['Station','İstasyon','Станция'],popular:['Dish popularity','Yemek popülerliği','Популярность блюд'],localOnly:['Local demo · same browser only','Yerel demo · tek tarayıcı','Локальное демо · один браузер'],period:['Period','Dönem','Период'],cost:['Ingredient cost','Malzeme maliyeti','Себестоимость'],late:['Late','Gecikmiş','Задержка']};for(const [k,v] of Object.entries(labels))['en','tr','ru'].forEach((l,i)=>I[l][k]=v[i]);

function addCart(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];render()}
function pos(){return header('pos','localOnly')+`<div class="grid dashcols"><div class="panel"><div class="filters">${['all','Sushi','Hot','Grill','Fry','Dessert','Drinks'].map(k=>btn(k,`stationFilter='${k}';render()`,stationFilter===k?'':'outline')).join('')}</div>${recipes.filter(r=>stationFilter==='all'||r.station===stationFilter).map(r=>`<div class="menurow"><img src="${dishPhotos[r.id]}" alt="${esc(r.title[lang])}" style="width:86px;height:65px;object-fit:cover;border-radius:9px"><div style="flex:1"><b>${esc(r.title[lang])}</b><span class="muted">${r.station} · ${r.mins} min</span></div><b>${money(r.price)}</b>${btn('+',`addCart('${r.id}',1)`,'sm')}</div>`).join('')}</div><div class="panel cart"><h2>${t('newOrder')}</h2><label class="field">${t('table')}<input value="${esc(tableNo)}" maxlength="20" oninput="tableNo=this.value"></label>${Object.entries(cart).map(([id,q])=>`<div class="menurow"><div><b>${esc(dish(id).title[lang])}</b>${money(dish(id).price*q)}</div>${btn('−',`addCart('${id}',-1)`,'sm outline')} ${q} ${btn('+',`addCart('${id}',1)`,'sm outline')}</div>`).join('')}<h2 style="margin-top:20px">${t('total')}: ${money(Object.entries(cart).reduce((a,[id,q])=>a+dish(id).price*q,0))}</h2>${btn(t('send'),'submitOrder()')}</div></div>`}
function submitOrder(){if(!Object.keys(cart).length||!tableNo.trim())return toast(t('invalid'));let need={};for(const [id,q] of Object.entries(cart))for(const [k,v] of Object.entries(dish(id).items))need[k]=(need[k]||0)+v*q;let missing=Object.entries(need).filter(([k,v])=>!item(k)||item(k).qty<v||item(k).unit!==seed.find(x=>x.id===k).unit);if(missing.length)return toast(t('notEnough')+': '+missing.map(([k])=>nm(k)).join(', '));for(const [k,v] of Object.entries(need))item(k).qty-=v;let now=Date.now();state.orders.push({id:now,table:tableNo.trim(),created:now,lines:Object.entries(cart).map(([id,q])=>({id,q,price:dish(id).price,cost:cost(dish(id)),status:'new',chef:chef(dish(id))}))});cart={};log('newOrder','#'+now);go('orders')}

function metrics(days){let start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-days+1);let os=state.orders.filter(o=>o.served>=+start),ls=os.flatMap(o=>o.lines),rev=ls.reduce((a,l)=>a+l.q*l.price,0),c=ls.reduce((a,l)=>a+l.q*l.cost,0);return {os,ls,rev,c,start}}
