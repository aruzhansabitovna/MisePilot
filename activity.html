function dashboard(){let lows=state.stock.filter(low);return `${header('overview','overviewSub',btn('↓ '+t('exportData'),'exportData()','outline'))}<div class="hero"><div><div class="eyebrow" style="color:#9ce4b8">${t('pilot')}</div><h2>${t('welcome')}</h2><p>${t('intro')}</p>${btn(t('launch'),'go("inventory")','light')}</div><div class="heroart">👩‍🍳</div></div><div class="grid stats">${stat('📦',state.stock.length,'products')}${stat('⚠️',lows.length,'low')}${stat('📖',recipes.length,'dishcount')}${stat('🍽️',state.prepared,'prepared')}</div><div class="grid dashcols"><div class="panel"><div class="hrow"><h2>${t('stockOverview')}</h2>${btn(t('viewAll'),'go("inventory")','sm outline')}</div>${stockTable(state.stock.slice(0,6),false)}</div><div class="panel"><h2>${t('attention')}</h2>${lows.length?`<div class="alert">⚠️ ${lows.length} ${t('lowMessage')}</div>`:''}${lows.map(x=>`<div class="log"><span class="emoji">${x.emoji}</span><div style="flex:1"><b>${esc(nm(x.id))}</b><div class="muted">${fmt(x.qty)} ${x.unit} / ${t('minimum')}: ${fmt(x.min)} ${x.unit}</div></div><span class="pill red">${t('lowStock')}</span></div>`).join('')||`<span class="pill">✓ ${t('healthy')}</span>`}<h2 style="margin-top:22px">${t('recent')}</h2>${logHtml(3)}</div></div>`}
function inventory(){let filtered=state.stock.filter(x=>(filter==='all'||x.zone===filter)&&nm(x.id).toLowerCase().includes(search.toLowerCase()));return `${header('inventory','demoDesc',btn('+ '+t('addIngredient'),'ingredientModal()'))}<div class="panel"><div class="hrow"><div class="filters">${['all','fridge','freezer','dry'].map(k=>`<button class="filter ${filter===k?'active':''}" onclick="filter=${JSON.stringify(k)};render()">${t(k)}</button>`).join('')}</div><input class="search" value="${esc(search)}" placeholder="${t('search')}" oninput="search=this.value;renderStockOnly()" id="stocksearch"></div><div id="stocktable">${stockTable(filtered)}</div></div>`}function renderStockOnly(){let filtered=state.stock.filter(x=>(filter==='all'||x.zone===filter)&&nm(x.id).toLowerCase().includes(search.toLowerCase()));document.getElementById('stocktable').innerHTML=stockTable(filtered)}function recipesPage(){return `${header('recipes','recipesSub')}<div class="grid recipegrid">${recipes.map(r=>`<div class="panel recipe"><div class="foodpic"><img src="${dishPhotos[r.id]||''}" alt="${esc(r.title[lang])}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.classList.add('show')"><span class="photo-fallback">${r.emoji}</span></div><div class="recipebody"><div class="eyebrow">${t('recipeTime')} · ${r.mins} ${t('minutes')}</div><h3>${esc(r.title[lang])}</h3><p class="sub">${Object.keys(r.items).map(nm).join(' · ')}</p><div class="recipefoot"><span class="pill">🍽 ${r.servings} ${t('servings')}</span>${btn(t('details'),'recipeModal("'+r.id+'")','sm')}</div></div></div>`).join('')}</div>`}function recipeModal(id){let r=recipes.find(x=>x.id===id),missing=Object.entries(r.items).filter(([k,v])=>(item(k)?.qty||0)<v);openModal(`<div class="modalhead"><div><div class="eyebrow">${t('recipes')} / ${r.mins} ${t('minutes')}</div><h1>${r.emoji} ${esc(r.title[lang])}</h1><p class="sub">${r.servings} ${t('servings')}</p></div><button class="close" onclick="closeModal()">✕</button></div><h2>${t('ingredients')}</h2><div class="tablewrap"><table><thead><tr><th>${t('ingredient')}</th><th>${t('required')}</th><th>${t('current')}</th><th>${t('status')}</th></tr></thead><tbody>${Object.entries(r.items).map(([k,v])=>`<tr><td>${esc(nm(k))}</td><td>${v} ${item(k)?.unit||''}</td><td>${fmt(item(k)?.qty||0)}</td><td><span class="pill ${(item(k)?.qty||0)<v?'red':''}">${t((item(k)?.qty||0)<v?'missing':'available')}</span></td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:24px">${t('method')}</h2><p class="sub" style="margin-bottom:14px">${t('photoTip')}</p><div class="guide-tip">📸 ${lang==='tr'?'Her adım için gerçek mutfak fotoğrafı yükleyin. Fotoğraflar yalnızca bu tarayıcıda saklanır.':lang==='ru'?'Загрузите настоящие фотографии каждого этапа приготовления. Они сохраняются только в этом браузере.':'Upload real kitchen photos for each preparation step. Photos are saved only in this browser.'}</div><div class="steps">${r.steps.map((s,i)=>{let key=r.id+'_'+i,photo=state.photos[key];return `<div class="step"><div class="stepnum">${i+1}</div><div class="stepvisual">${photo?`<img src="${photo}" style="width:65px;height:65px;object-fit:cover;border-radius:9px" alt="Step ${i+1}">`:`<span class="step-placeholder">${s.emoji}<small>${lang==='tr'?'ADIM':lang==='ru'?'ШАГ':'STEP'} ${i+1}</small></span>`}</div><div style="flex:1"><div>${esc(s[lang])}</div><div class="step-actions"><label class="btn sm outline" style="cursor:pointer">📷 ${t('addPhoto')}<input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(event,'${key}','${id}')"></label>${photo?` ${btn('✕ '+t('clearPhoto'),`removePhoto('${key}','${id}')`,'sm danger')}`:''}</div></div></div>`}).join('')}</div>${missing.length?`<div class="alert" style="margin-top:18px">⚠️ ${t('recipeUnavailable')}: ${missing.map(([k])=>nm(k)).join(', ')}</div>`:''}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">${btn('🖨 '+(lang==='tr'?'Yazdır':lang==='ru'?'Печать':'Print guide'),`printRecipe('${id}')`,'outline')}${btn(t('cancel'),'closeModal()','outline')}${btn('▶ '+t('deduct'),`startCooking('${id}')`,missing.length?'outline':'')}</div>`)}function uploadPhoto(e,key,id){let f=e.target.files?.[0];if(!f)return;if(f.size>850000){toast('Please use an image smaller than 850 KB');return}let reader=new FileReader;reader.onload=()=>{state.photos[key]=reader.result;persist();toast(t('photoSaved'));recipeModal(id)};reader.readAsDataURL(f)}function removePhoto(key,id){delete state.photos[key];persist();recipeModal(id)}
function startCooking(id){let r=recipes.find(x=>x.id===id);let missing=Object.entries(r.items).filter(([k,v])=>(item(k)?.qty||0)<v);if(missing.length){toast(t('recipeUnavailable'));return}Object.entries(r.items).forEach(([k,v])=>item(k).qty-=v);log('cooked',r.title.en);selectedRecipe=id;timer.recipe=id;timer.remaining=r.mins*60;timer.running=false;timer.started=true;localStorage.setItem('mp_timer',JSON.stringify({recipe:id,remaining:timer.remaining,started:true,running:false}));closeModal();go('preparation');toast(t('stockUpdated'))}function preparation(){let r=recipes.find(x=>x.id===timer.recipe)||recipes[0];return `${header('preparation','timerSub')}<div class="grid dashcols"><div class="panel"><h2>${t('selectRecipe')}</h2><div class="grid" style="gap:10px">${recipes.map(x=>`<button class="filter ${timer.recipe===x.id?'active':''}" style="text-align:left;border-radius:12px" onclick="chooseTimer('${x.id}')">${x.emoji} ${esc(x.title[lang])} <span class="muted">· ${x.mins} ${t('minutes')}</span></button>`).join('')}</div><p class="sub" style="margin-top:16px">${t('demoDesc')}</p></div><div class="panel"><h2>${t('activeTimer')}</h2><div class="timerbox"><div style="font-size:58px">${r.emoji}</div><h3>${esc(r.title[lang])}</h3><div class="clock" id="clock">${clock()}</div><div style="display:flex;justify-content:center;gap:9px;flex-wrap:wrap">${btn('▶ '+t('start'),'toggleTimer(true)','sm')}${btn('Ⅱ '+t('pause'),'toggleTimer(false)','sm outline')}${btn('↺ '+t('reset'),'resetTimer()','sm outline')}</div><div style="margin-top:14px">${btn('✓ '+t('done'),'finishCooking()','light')}</div></div></div></div>`}function chooseTimer(id){timer.recipe=id;timer.remaining=recipes.find(r=>r.id===id).mins*60;timer.running=false;timer.started=false;render()}function clock(){let n=Math.max(0,timer.remaining);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function toggleTimer(v){if(!timer.remaining)resetTimer();timer.running=v;timer.started=true}function resetTimer(){timer.remaining=recipes.find(r=>r.id===timer.recipe).mins*60;timer.running=false;timer.started=false;let el=document.getElementById('clock');if(el)el.textContent=clock()}function finishCooking(){timer.running=false;state.prepared++;log('finished',recipes.find(r=>r.id===timer.recipe).title.en);toast(t('finished'));render()}
function storage(){let z=state.stock.filter(x=>x.zone===zoneFilter);return `${header('storage','storageSub')}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px">${[['fridge','🧊'],['freezer','❄️'],['dry','🌾']].map(([k,e])=>`<button class="panel" onclick="zoneFilter='${k}';render()" style="text-align:left;border:${zoneFilter===k?'2px solid #20785b':'1px solid var(--line)'}"><div style="font-size:35px">${e}</div><h2 style="margin:9px 0">${t(k)}</h2><div class="sub">${state.stock.filter(x=>x.zone===k).length} ${t('storageCount')}</div></button>`).join('')}</div><div class="panel"><h2>${t(zoneFilter)}</h2>${stockTable(z,false)}</div>`}function layout(){let zones=[['receiving','📦'],['dry','🌾'],['fridge','🧊'],['prepArea','🔪'],['hotLine','🔥'],['plating','🍽️'],['wash','🧼'],['freezer','❄️'],['pass','🛎️']];return `${header('layout','layoutSub')}<div class="panel"><div class="layout">${zones.map(([k,e])=>`<div class="zone"><span>${e}</span><b>${t(k)}</b><small>${['dry','fridge','freezer'].includes(k)?state.stock.filter(x=>x.zone===k).length+' '+t('products'):''}</small></div>`).join('')}</div><p class="sub" style="margin-top:17px">ℹ ${t('layoutNote')}</p></div>`}function activity(){return `${header('activity','activitySub',btn('↓ '+t('exportData'),'exportData()','outline')+' '+btn(t('clearLog'),'clearLog()','danger'))}<div class="panel">${logHtml(100)}</div>`}
function printRecipe(id){let r=recipes.find(x=>x.id===id);if(!r)return;let win=window.open('','_blank');if(!win){toast('Allow pop-ups to print');return}let rows=Object.entries(r.items).map(([k,v])=>'<li>'+esc(nm(k))+' — '+v+' '+esc(item(k)?.unit||'')+'</li>').join('');let steps=r.steps.map((x,i)=>'<li style="margin:0 0 15px">'+esc(x[lang])+(state.photos[id+'_'+i]?'<div><img style="width:230px;max-height:170px;object-fit:cover" src="'+state.photos[id+'_'+i]+'"></div>':'')+'</li>').join('');win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(r.title[lang])+'</title><style>body{font:16px Arial;max-width:760px;margin:40px auto;line-height:1.6;color:#173b2c}h1{font-size:28px}li{margin-bottom:7px}</style></head><body><h1>MisePilot · '+esc(r.title[lang])+'</h1><p>'+r.mins+' min · '+r.servings+' portions</p><h2>'+esc(t('ingredients'))+'</h2><ul>'+rows+'</ul><h2>'+esc(t('method'))+'</h2><ol>'+steps+'</ol><p>University project · Demo recipe</p></body></html>');win.document.close();win.focus();setTimeout(()=>win.print(),350)}
function render(){document.documentElement.lang=lang;document.getElementById('language').value=lang;document.querySelector('[data-t="workspace"]').textContent=t('workspace');document.querySelector('[data-t="project"]').textContent=t('project');document.getElementById('nav').innerHTML=NAV.map(([k,ic])=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${ic}</span>${t(k)}</button>`).join('');document.getElementById('crumb').textContent=t(page);document.getElementById('content').innerHTML=({dashboard,inventory,recipes:recipesPage,preparation,storage,layout,activity})[page]()}function openModal(html){document.getElementById('overlay').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function ingredientModal(id){let x=id?item(id):null;openModal(`<div class="modalhead"><h2>${t(x?'editIngredient':'addIngredient')}</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveIngredient(event,'${id||''}')"><div class="formgrid"><label class="field">${t('name')}<input name="name" required value="${esc(x?nm(x.id):'')}"></label><label class="field">${t('unit')}<select name="unit">${['g','kg','ml','L','pcs'].map(u=>`<option ${x?.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="field">${t('quantity')}<input name="qty" type="number" min="0" step="any" required value="${x?.qty??0}"></label><label class="field">${t('minimum')}<input name="min" type="number" min="0" step="any" required value="${x?.min??100}"></label><label class="field">${t('location')}<select name="zone">${['fridge','freezer','dry'].map(z=>`<option value="${z}" ${x?.zone===z?'selected':''}>${t(z)}</option>`).join('')}</select></label></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:23px">${x?btn(t('delete'),`deleteIngredient('${id}')`,'danger'):''}<button type="button" class="btn outline" onclick="closeModal()">${t('cancel')}</button><button type="submit" class="btn">${t('save')}</button></div></form>`)}function saveIngredient(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let qty=Number(d.qty),min=Number(d.min);if(!d.name.trim()||!Number.isFinite(qty)||qty<0||!Number.isFinite(min)||min<0){toast(t('invalid'));return}let x=id?item(id):null;if(x){x.custom=d.name;x.qty=qty;x.min=min;x.unit=d.unit;x.zone=d.zone}else{let newId='custom_'+Date.now();state.stock.push({id:newId,custom:d.name,qty,min,unit:d.unit,zone:d.zone,emoji:'📦'})}log('created',d.name);closeModal();render();toast(t('saved'))}function deleteIngredient(id){if(!confirm(t('confirmDelete')))return;let x=item(id);state.stock=state.stock.filter(z=>z.id!==id);log('removed',nm(id));closeModal();render()}function adjustModal(id){let x=item(id);openModal(`<div class="modalhead"><div><h2>${t('adjust')}: ${esc(nm(id))}</h2><p class="sub">${t('current')}: ${fmt(x.qty)} ${x.unit}</p></div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="adjustStock(event,'${id}')"><div class="formgrid"><label class="field">${t('change')}<input name="delta" type="number" step="any" required placeholder="-100 or 500"></label><label class="field">${t('reason')}<input name="reason" placeholder="Delivery / Waste / Correction"></label></div><div style="text-align:right;margin-top:20px"><button class="btn" type="submit">${t('save')}</button></div></form>`)}function adjustStock(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let delta=Number(d.delta),x=item(id);if(!Number.isFinite(delta)||x.qty+delta<0){toast(t('qtyMust'));return}x.qty+=delta;log('stockAdjusted',nm(id)+' '+(delta>=0?'+':'')+delta+' '+x.unit+(d.reason?' · '+d.reason:''));closeModal();render();toast(t('stockUpdated'))}function clearLog(){if(!confirm(t('clearConfirm')))return;state.logs=[];persist();render()}function exportData(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MisePilot-data.json';a.click();URL.revokeObjectURL(a.href);toast(t('exported'))}setInterval(()=>{if(timer.running&&timer.remaining>0){timer.remaining--;localStorage.setItem('mp_timer',JSON.stringify({recipe:timer.recipe,remaining:timer.remaining,started:timer.started,running:false}));let el=document.getElementById('clock');if(el)el.textContent=clock();if(timer.remaining===0){timer.running=false;toast(t('timerComplete'))}}},1000);try{let saved=JSON.parse(localStorage.getItem('mp_timer')||'null');if(saved&&recipes.some(r=>r.id===saved.recipe)){timer.recipe=saved.recipe;timer.remaining=Math.max(0,Number(saved.remaining)||0);timer.started=!!saved.started;timer.running=false}else{timer.remaining=recipes[0].mins*60}}catch{timer.remaining=recipes[0].mins*60}render();
</script></body></html>
